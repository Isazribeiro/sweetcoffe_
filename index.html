    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Sabor - Cadastre-se</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="caixa">
        <!-- Lado esquerdo: Promo com fundo dos copos -->
        <div class="ilustracao-lado">
            <div class="promo-texto">
                <h2>50% OFF</h2>
                <p>para novos clientes</p>
                <div class="cupom">CUPOM: SW33T26</div>
            </div>
        </div>

        <!-- Lado direito: Formulário de cadastro -->
        <div class="form-lado">
            <div class="logo">
                <img src="logo-ks.png" alt="Logo Café Sabor">
                <span>Sweet coffee</span>
            </div>

            <h1 class="titulo">Cadastre-se e Faça Parte!</h1>
            <p class="subtitulo">Junte-se ao nosso café e aproveite ofertas e novidades!</p>

            <form action="#" method="post">
                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" class="input-padrao" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" class="input-padrao" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular" class="input-padrao" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="senha">Crie uma Senha</label>
                    <input type="password" id="senha" name="senha" class="input-padrao" placeholder="Crie uma senha" required>
                </div>

                <div class="campo">
                    <label for="confirma-senha">Confirme sua Senha</label>
                    <input type="password" id="confirma-senha" name="confirma-senha" class="input-padrao" placeholder="Confirme a senha" required>
                </div>

                <div class="checkbox-area">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Aceito os Termos e Condições</label>
                </div>

                <input type="submit" value="Cadastrar-se" class="enviar">
            </form>

            <p class="login-link">
                Já tem uma conta? <a href="#">Entrar</a>
            </p>
        </div>
    </div>
</body>
</html>
